name: A1 RevP3 Numeric QA

on:
  push:
    branches:
      - tmp-a1-revp3-road-qa
    paths:
      - tools/build_revp3_roadqa.py
      - tools/patch_revp3_prebuild.py
      - tools/patch_revp3_alignment_v2.py
      - tools/patch_revp3_interface_completion.py
      - tools/patch_revp3_qa_hardening.py
      - tools/diagnose_revp3_paths.py
      - .github/workflows/a1-revp3-numeric.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/build_revp3_roadqa.py
      - tools/patch_revp3_prebuild.py
      - tools/patch_revp3_alignment_v2.py
      - tools/patch_revp3_interface_completion.py
      - tools/patch_revp3_qa_hardening.py
      - tools/diagnose_revp3_paths.py
      - .github/workflows/a1-revp3-numeric.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OUT_ROOT: revp3_output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-a1-revp3-road-qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry dependencies
        run: pip install --disable-pip-version-check 'numpy<2.0' scipy shapely trimesh pygltflib mapbox_earcut requests rtree
      - name: Apply controlled alignment, interface and QA patches
        run: |
          python tools/patch_revp3_prebuild.py
          python tools/patch_revp3_alignment_v2.py
          sed -i 's/Intentional road-road junctions; curbs\/rails stop here\./Intentional road-road junctions; roadside curbs\/rails stop here\./g' tools/patch_revp3_interface_completion.py
          sed -i 's/580\.5, 163\.0/570.0, 162.0/g' tools/patch_revp3_interface_completion.py
          python tools/patch_revp3_interface_completion.py
          python tools/patch_revp3_qa_hardening.py
      - name: Print exact horizontal-radius diagnostics
        run: python tools/diagnose_revp3_paths.py
      - name: Build Rev.P3 and enforce numerical acceptance
        run: python tools/build_revp3_roadqa.py
      - name: Print QA
        run: cat revp3_output/20_Road_QA_Report_RevP3.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a1-revp3-numeric-test
          path: |
            revp3_output/
            revp3_path_diagnostics.json
          retention-days: 1
          compression-level: 3
