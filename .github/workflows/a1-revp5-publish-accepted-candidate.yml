name: A1 RevP5 Publish Accepted Candidate

on:
  push:
    branches: [tmp-a1-revp5-integrated-bim]
    paths:
      - tools/revp5_blender_meshqa.py
      - tools/render_revp5_masterplan_qa.py
      - tools/prepare_revp5_release.py
      - tools/package_revp5_integrated.py
      - .github/workflows/a1-revp5-publish-accepted-candidate.yml
  pull_request:
    branches: [main]
    paths:
      - tools/revp5_blender_meshqa.py
      - tools/render_revp5_masterplan_qa.py
      - tools/prepare_revp5_release.py
      - tools/package_revp5_integrated.py
      - .github/workflows/a1-revp5-publish-accepted-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUT_ROOT: revp5_output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-a1-revp5-integrated-bim
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: pip install --disable-pip-version-check pillow
      - name: Stage the accepted numerical candidate and immutable source
        run: |
          rm -rf revp5_output revp3_output work_revp3
          mkdir -p revp5_output revp3_output work_revp3
          cp audit/revp5_integrated_numeric/26_Модель_A1_RevP5_Integrated_preFEED.glb revp5_output/
          cp audit/revp5_integrated_numeric/26_Модель_A1_RevP5_Integrated_preFEED.obj revp5_output/
          cp audit/revp5_integrated_numeric/26_Integrated_QA_Report_RevP5.json revp5_output/
          cp audit/revp5_integrated_numeric/26_Masterplan_Change_Register_RevP5.json revp5_output/
          cp audit/revp5_integrated_numeric/26_Masterplan_Change_Register_RevP5.csv revp5_output/
          cp audit/revp5_integrated_numeric/20_Road_QA_Report_RevP3.json revp3_output/
          cp transfer_ready/20_Модель_A1_RevP2_ExteriorQA.glb work_revp3/
      - name: Verify accepted numerical candidate before visual QA
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('revp5_output')
          qa=json.loads((root/'26_Integrated_QA_Report_RevP5.json').read_text(encoding='utf-8'))
          a=qa['acceptance']; r=qa['road_acceptance_reused']
          assert qa['status']=='PASS_CONTROLLED_PRE_FEED'
          assert a['road_building_clashes']==[]
          assert a['open_external_critical_clashes']==0
          assert a['terrain_above_road_points']==0
          assert a['non_adjacent_road_triangle_self_intersections']==0
          assert a['duplicated_top_faces']==0
          assert a['non_manifold_edges']==0
          assert a['required_masterplan_features_present'] is True
          assert a['new_physical_feature_building_overlap_m2']<=1e-6
          assert a['new_physical_feature_unintended_road_overlap_m2']<=1e-6
          assert r['maximum_longitudinal_grade_pct']<=6.000001
          assert r['minimum_horizontal_radius_m']>=11.999999
          for name in ['26_Модель_A1_RevP5_Integrated_preFEED.glb','26_Модель_A1_RevP5_Integrated_preFEED.obj']:
              p=root/name; h=hashlib.sha256(p.read_bytes()).hexdigest(); print(name,p.stat().st_size,h)
          print('ACCEPTED_NUMERIC_CANDIDATE_VERIFIED')
          PY
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
          blender --version
      - name: Run final Blender road-mesh QA
        run: blender -b --python tools/revp5_blender_meshqa.py
      - name: Prepare controlled release metadata
        run: python tools/prepare_revp5_release.py
      - name: Render seven identical-camera before and after pairs
        run: |
          blender -b --python tools/render_revp5_masterplan_qa.py
          test "$(find revp5_output/qa_png -maxdepth 1 -name '*_BEFORE_RevP2.png' | wc -l)" -eq 7
          test "$(find revp5_output/qa_png -maxdepth 1 -name '*_AFTER_RevP5.png' | wc -l)" -eq 7
      - name: Preserve reproducible scripts
        run: |
          mkdir -p revp5_output/reproducible_scripts
          cp tools/integrate_revp5_masterplan.py tools/revp5_blender_meshqa.py tools/render_revp5_masterplan_qa.py tools/prepare_revp5_release.py tools/package_revp5_integrated.py revp5_output/reproducible_scripts/
      - name: Package complete controlled release
        run: python tools/package_revp5_integrated.py
      - name: Final acceptance and archive integrity audit
        run: |
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          root=Path('revp5_output')
          required=['26_Модель_A1_RevP5_Integrated_preFEED.glb','26_Модель_A1_RevP5_Integrated_preFEED.obj','26_Комплект_A1_RevP5_Integrated_preFEED.zip','26_Integrated_QA_Report_RevP5.json','26_Road_QA_Report_RevP5.json','26_Blender_Road_Mesh_QA_RevP5.json','26_Masterplan_Change_Register_RevP5.json','26_Masterplan_Change_Register_RevP5.csv','26_RevP5_Version_Manifest.json','26_SHA256SUMS_RevP5.txt','26_Release_SHA256_RevP5.txt','26_Visual_QA_Report_RevP5.json','26_RevP5_Visual_QA_ContactSheet.jpg','26_README_RevP5.md']
          for name in required:
              p=root/name; assert p.exists() and p.stat().st_size>0,(name,p.exists())
          qa=json.loads((root/'26_Integrated_QA_Report_RevP5.json').read_text(encoding='utf-8'))
          a=qa['acceptance']
          assert qa['status']=='PASS_CONTROLLED_PRE_FEED'
          assert a['blender_non_adjacent_road_triangle_self_intersections']==0
          assert a['blender_zero_area_faces']==0
          assert a['blender_zero_length_edges']==0
          assert len(list((root/'qa_png').glob('*.png')))==14
          assert len(list((root/'qa_compare').glob('*.png')))==7
          with zipfile.ZipFile(root/'26_Комплект_A1_RevP5_Integrated_preFEED.zip') as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for name in required:
                  if name!='26_Комплект_A1_RevP5_Integrated_preFEED.zip': assert name in names,name
          print('REV_P5_FAST_RELEASE_PASS')
          PY
      - name: Commit immutable controlled release and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin tmp-a1-revp5-integrated-bim
          git rebase origin/tmp-a1-revp5-integrated-bim
          rm -rf release_revp5_integrated
          mkdir -p release_revp5_integrated
          cp -a revp5_output/. release_revp5_integrated/
          printf 'PASS_CONTROLLED_PRE_FEED\n' > release_revp5_integrated/SUCCESS_FINAL_PASS.txt
          git add release_revp5_integrated/
          git commit -m "Publish A.1 Rev.P5 integrated pre-FEED masterplan [skip ci]"
          git push origin HEAD:tmp-a1-revp5-integrated-bim
          git rev-parse HEAD | tee release_commit_sha.txt
          tag="a1-revp5-integrated-prefeed-2026-08-25"
          git tag -f "$tag" HEAD
          git push -f origin "$tag"
          printf '%s\n' "$tag" > release_tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: a1-revp5-integrated-release-final
          path: |
            release_revp5_integrated/
            release_commit_sha.txt
            release_tag.txt
          retention-days: 7
          compression-level: 3
      - uses: actions/upload-artifact@v4
        with:
          name: a1-revp5-integrated-main-glb
          path: release_revp5_integrated/26_Модель_A1_RevP5_Integrated_preFEED.glb
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: a1-revp5-integrated-user-zip
          path: release_revp5_integrated/26_Комплект_A1_RevP5_Integrated_preFEED.zip
          retention-days: 7
          compression-level: 0
