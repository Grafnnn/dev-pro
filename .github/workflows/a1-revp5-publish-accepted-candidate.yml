name: A1 RevP5 Accepted Candidate Verification (Non-publishing)

on:
  workflow_dispatch:

concurrency:
  group: a1-revp5-accepted-candidate-verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUT_ROOT: revp5_output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-a1-revp5-integrated-bim
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: pip install --disable-pip-version-check pillow
      - name: Stage the accepted numerical candidate and immutable source
        run: |
          rm -rf revp5_output revp3_output work_revp3
          mkdir -p revp5_output revp3_output work_revp3
          cp audit/revp5_integrated_numeric/26_Модель_A1_RevP5_Integrated_preFEED.glb revp5_output/
          cp audit/revp5_integrated_numeric/26_Модель_A1_RevP5_Integrated_preFEED.obj revp5_output/
          cp audit/revp5_integrated_numeric/26_Integrated_QA_Report_RevP5.json revp5_output/
          cp audit/revp5_integrated_numeric/26_Masterplan_Change_Register_RevP5.json revp5_output/
          cp audit/revp5_integrated_numeric/26_Masterplan_Change_Register_RevP5.csv revp5_output/
          cp audit/revp5_integrated_numeric/20_Road_QA_Report_RevP3.json revp3_output/
          cp transfer_ready/20_Модель_A1_RevP2_ExteriorQA.glb work_revp3/
      - name: Verify accepted numerical candidate before visual QA
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('revp5_output')
          qa=json.loads((root/'26_Integrated_QA_Report_RevP5.json').read_text(encoding='utf-8'))
          a=qa['acceptance']; r=qa['road_acceptance_reused']
          assert qa['status']=='PASS_CONTROLLED_PRE_FEED'
          assert a['road_building_clashes']==[]
          assert a['open_external_critical_clashes']==0
          assert a['terrain_above_road_points']==0
          assert a['non_adjacent_road_triangle_self_intersections']==0
          assert a['duplicated_top_faces']==0
          assert a['non_manifold_edges']==0
          assert a['d3_d5_junction_status']=='PASS'
          assert a['d3_d5_road_final_overlap_m2']<=1e-6
          assert a['d3_d5_maximum_full_seam_vertical_step_m']<=0.005001
          assert a['d3_d5_blended_maximum_centerline_grade_pct']<=6.000001
          assert a['d3_d5_maximum_resultant_surface_grade_pct']<=100.0*(0.06**2+0.02**2)**0.5+1e-6
          assert a['d3_d5_minimum_road_shoulder_vertical_overlap_m']>0.005
          assert a['d3_d5_maximum_road_shoulder_vertical_overlap_m']<=0.25
          assert a['d3_d5_minimum_shoulder_subbase_vertical_overlap_m']>0.005
          assert a['d3_d5_maximum_shoulder_subbase_vertical_overlap_m']<=0.12
          assert a['d3_d5_reverse_grade_sample_count']==0
          assert a['d3_d5_protected_sliver_removals']==0
          assert a['required_masterplan_features_present'] is True
          assert a['new_physical_feature_building_overlap_m2']<=1e-6
          assert a['new_physical_feature_unintended_road_overlap_m2']<=1e-6
          assert a['emergency_bay_plan_component_count']==1
          assert a['emergency_bay_mesh_component_count']==1
          assert a['emergency_bay_shared_d3_seam_m']>=20.0
          assert a['emergency_bay_gap_m']<=1e-6
          assert a['emergency_bay_maximum_vertical_step_m']<=0.020001
          assert a['emergency_bay_maximum_resultant_grade_pct']<=6.000001
          assert a['emergency_bay_maximum_nominal_formation_fill_m']<=0.500001
          assert a['emergency_bay_maximum_nominal_formation_cut_m']<=1.000001
          assert a['emergency_bay_maximum_actual_unsupported_gap_m']<=1e-6
          assert a['emergency_bay_maximum_actual_foundation_cut_m']<=0.950001
          assert a['emergency_bay_minimum_residual_ground_key_in_m']>=0.099999
          assert a['emergency_bay_minimum_exact_tin_ground_key_in_m']>=0.099999
          assert a['emergency_bay_maximum_exact_tin_foundation_cut_m']<=0.950001
          assert a['emergency_bay_foundation_bottom_is_single_plane'] is True
          assert a['emergency_bay_foundation_bottom_plane_grade_pct']<=6.000001
          assert a['emergency_bay_foundation_bottom_planarity_residual_m']<=1e-8
          assert a['emergency_bay_top_affine_residual_m']<=1e-8
          assert a['emergency_bay_exact_tin_triangle_count']>0
          assert a['emergency_bay_exact_tin_extrema_vertex_count']>=3
          assert a['emergency_bay_exact_tin_coverage_delta_m2']<=1e-6
          assert a['emergency_bay_outer_foundation_watertight'] is True
          assert a['emergency_bay_outer_foundation_open_or_nonmanifold_edges']==0
          assert a['emergency_bay_outer_foundation_connected_components']==1
          assert a['emergency_bay_minimum_actual_foundation_thickness_m']>=0.499999
          assert a['emergency_bay_maximum_actual_foundation_thickness_m']<=1.050001
          assert a['emergency_bay_support_partition_pairwise_overlap_m2']<=1e-6
          assert a['emergency_bay_support_partition_coverage_gap_m2']<=1e-6
          assert a['emergency_bay_source_terrain_sha_verified'] is True
          assert a['heavy_haul_unapproved_clearance_overlap_count']==0
          assert r['maximum_longitudinal_grade_pct']<=6.000001
          assert r['minimum_horizontal_radius_m']>=11.999999
          for name in ['26_Модель_A1_RevP5_Integrated_preFEED.glb','26_Модель_A1_RevP5_Integrated_preFEED.obj']:
              p=root/name; h=hashlib.sha256(p.read_bytes()).hexdigest(); print(name,p.stat().st_size,h)
          print('ACCEPTED_NUMERIC_CANDIDATE_VERIFIED')
          PY
      - name: Install Blender
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender -b --python-exit-code 1 --python-expr "import numpy; print('BLENDER_NUMPY', numpy.__version__)"
      - name: Run final Blender road-mesh QA
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: blender -b --python-exit-code 1 --python tools/revp5_blender_meshqa.py
      - name: Prepare controlled release metadata
        run: python tools/prepare_revp5_release.py
      - name: Render seven identical-camera before and after pairs
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          blender -b --python-exit-code 1 --python tools/render_revp5_masterplan_qa.py
          test "$(find revp5_output/qa_png -maxdepth 1 -name '*_BEFORE_RevP2.png' | wc -l)" -eq 7
          test "$(find revp5_output/qa_png -maxdepth 1 -name '*_AFTER_RevP5.png' | wc -l)" -eq 7
      - name: Preserve reproducible scripts
        run: |
          mkdir -p revp5_output/reproducible_scripts
          cp tools/integrate_revp5_masterplan.py tools/revp5_blender_meshqa.py tools/render_revp5_masterplan_qa.py tools/prepare_revp5_release.py tools/package_revp5_integrated.py tools/patch_revp5_d3_d5_junction.py tools/patch_revp5_partition_order.py revp5_output/reproducible_scripts/
      - name: Stage controlled engineering visual review input when supplied
        run: |
          review_input="audit/revp5_engineering_visual_review/26_Engineering_Visual_Review_RevP5.json"
          if [ -f "$review_input" ]; then
            cp "$review_input" revp5_output/26_Engineering_Visual_Review_RevP5.json
            echo "Staged existing hash-bound engineering visual review."
          else
            echo "No controlled engineering visual review supplied; packaging will create a PENDING review template and stop at the manual gate."
          fi
      - name: Package complete controlled release
        id: package
        continue-on-error: true
        run: python tools/package_revp5_integrated.py
      - name: Upload evidence for manual engineering visual review
        if: ${{ steps.package.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: a1-revp5-engineering-visual-review-gate-candidate
          path: |
            revp5_output/26_Модель_A1_RevP5_Integrated_preFEED.glb
            revp5_output/26_Integrated_QA_Report_RevP5.json
            revp5_output/26_Visual_QA_Report_RevP5.json
            revp5_output/26_RevP5_Visual_QA_ContactSheet.jpg
            revp5_output/26_Engineering_Visual_Review_RevP5.json
            revp5_output/qa_png/
            revp5_output/qa_compare/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 3
      - name: Enforce manual engineering visual review gate
        if: ${{ steps.package.outcome == 'failure' }}
        run: |
          echo "::error::Release remains PENDING until the seven comparison images are reviewed and a hash-bound PASS review is supplied at audit/revp5_engineering_visual_review/26_Engineering_Visual_Review_RevP5.json."
          exit 1
      - name: Final acceptance and archive integrity audit
        run: |
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          root=Path('revp5_output')
          required=['26_Модель_A1_RevP5_Integrated_preFEED.glb','26_Модель_A1_RevP5_Integrated_preFEED.obj','26_Комплект_A1_RevP5_Integrated_preFEED.zip','26_Integrated_QA_Report_RevP5.json','26_Road_QA_Report_RevP5.json','26_Blender_Road_Mesh_QA_RevP5.json','26_Release_Status_RevP5.txt','26_Masterplan_Change_Register_RevP5.json','26_Masterplan_Change_Register_RevP5.csv','26_RevP5_Version_Manifest.json','26_SHA256SUMS_RevP5.txt','26_Release_SHA256_RevP5.txt','26_Visual_QA_Report_RevP5.json','26_RevP5_Visual_QA_ContactSheet.jpg','26_Engineering_Visual_Review_RevP5.json','26_README_RevP5.md']
          for name in required:
              p=root/name; assert p.exists() and p.stat().st_size>0,(name,p.exists())
          qa=json.loads((root/'26_Integrated_QA_Report_RevP5.json').read_text(encoding='utf-8'))
          a=qa['acceptance']
          assert qa['status']=='PASS_CONTROLLED_PRE_FEED'
          assert a['blender_non_adjacent_road_triangle_self_intersections']==0
          assert a['blender_zero_area_faces']==0
          assert a['blender_zero_length_edges']==0
          assert a['blender_emergency_bay_connected_components']==1
          assert a['blender_emergency_bay_topology_failures']==0
          review=json.loads((root/'26_Engineering_Visual_Review_RevP5.json').read_text(encoding='utf-8'))
          assert review['status']=='PASS',review
          assert review['reviewed_pair_count']==7,review
          assert review['open_blocking_findings']==[],review
          release_status=(root/'26_Release_Status_RevP5.txt').read_text(encoding='utf-8')
          assert 'ENGINEERING_VISUAL_REVIEW=PASS' in release_status,release_status
          assert 'ENGINEERING_VISUAL_REVIEW=PENDING' not in release_status,release_status
          manifest=json.loads((root/'26_RevP5_Version_Manifest.json').read_text(encoding='utf-8'))
          assert manifest['engineering_visual_review']['status']=='PASS',manifest
          assert len(list((root/'qa_png').glob('*.png')))==14
          assert len(list((root/'qa_compare').glob('*.png')))==7
          with zipfile.ZipFile(root/'26_Комплект_A1_RevP5_Integrated_preFEED.zip') as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert '26_Комплект_A1_RevP5_Integrated_preFEED.zip' not in names,names
              assert '26_Release_SHA256_RevP5.txt' not in names,names
              for name in required:
                  if name not in {'26_Комплект_A1_RevP5_Integrated_preFEED.zip','26_Release_SHA256_RevP5.txt'}: assert name in names,name
          print('REV_P5_FAST_RELEASE_PASS')
          PY
      - name: Stage non-publishing candidate verification payload
        run: |
          rm -rf release_revp5_integrated
          mkdir -p release_revp5_integrated
          cp -a revp5_output/. release_revp5_integrated/
          printf 'PASS_CONTROLLED_PRE_FEED\n' > release_revp5_integrated/SUCCESS_FINAL_PASS.txt
          git rev-parse HEAD | tee release_commit_sha.txt
          printf 'NOT_PUBLISHED__USE_CANONICAL_RELEASE_V2\n' > release_tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: a1-revp5-integrated-release-final
          path: |
            release_revp5_integrated/
            release_commit_sha.txt
            release_tag.txt
          retention-days: 7
          compression-level: 3
      - uses: actions/upload-artifact@v4
        with:
          name: a1-revp5-integrated-main-glb
          path: release_revp5_integrated/26_Модель_A1_RevP5_Integrated_preFEED.glb
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: a1-revp5-integrated-user-zip
          path: release_revp5_integrated/26_Комплект_A1_RevP5_Integrated_preFEED.zip
          retention-days: 7
          compression-level: 0
