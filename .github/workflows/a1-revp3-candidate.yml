name: A1 RevP3 Candidate Publisher

on:
  push:
    branches: [tmp-a1-revp3-road-qa]
    paths:
      - tools/build_revp3_roadqa.py
      - tools/patch_revp3_prebuild.py
      - tools/patch_revp3_alignment_v2.py
      - tools/patch_revp3_alignment_v3.py
      - tools/patch_revp3_final.py
      - .github/workflows/a1-revp3-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUT_ROOT: revp3_output
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-a1-revp3-road-qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check 'numpy<2.0' scipy shapely trimesh pygltflib mapbox_earcut requests rtree
      - name: Build numerical candidate
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf revp3_output work_revp3 candidate_log.txt
          {
            python tools/patch_revp3_prebuild.py
            python tools/patch_revp3_alignment_v2.py
            python tools/patch_revp3_alignment_v3.py
            python tools/patch_revp3_final.py
            python tools/build_revp3_roadqa.py
          } 2>&1 | tee candidate_log.txt
          exit ${PIPESTATUS[0]}
      - name: Commit candidate state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf candidate_revp3
          mkdir -p candidate_revp3
          cp candidate_log.txt candidate_revp3/build.log
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            cp revp3_output/20_Модель_A1_RevP3_RoadQA.glb candidate_revp3/
            cp revp3_output/20_Модель_A1_RevP3_RoadQA.obj candidate_revp3/
            cp revp3_output/20_Road_QA_Report_RevP3.json candidate_revp3/
            sha256sum candidate_revp3/20_* > candidate_revp3/SHA256_NUMERIC.txt
            printf 'PASS\n' > candidate_revp3/SUCCESS_NUMERIC_PASS.txt
          else
            tail -n 80 candidate_log.txt > candidate_revp3/FAILURE_NUMERIC.txt
          fi
          git add candidate_revp3/
          git diff --cached --quiet || git commit -m "Publish Rev.P3 numerical candidate state [skip ci]"
          git push origin HEAD:tmp-a1-revp3-road-qa
      - name: Stop on numerical failure
        if: steps.build.outcome != 'success'
        run: exit 1
