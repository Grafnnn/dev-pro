name: A1 Model Audit

on:
  push:
    branches:
      - tmp-a1-revp2-exterior-qa
    paths-ignore:
      - audit/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_ZIP_URL: https://at.adobe.com/aXK6C7lAS2lRSKjj
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-a1-revp2-exterior-qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install --disable-pip-version-check requests numpy scipy shapely trimesh pygltflib
      - name: Audit model
        run: |
          python tools/audit_a1_model.py
          python tools/exterior_inventory.py
          python tools/extract_source_snippets.py
          python tools/critical_geometry.py
      - name: Commit temporary audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/model_audit.json audit/exterior_inventory.md audit/exterior_inventory.json audit/source_snippets.txt audit/critical_geometry.md
          git diff --cached --quiet || git commit -m "Store temporary A1 critical geometry audit [skip ci]"
          git push origin HEAD:tmp-a1-revp2-exterior-qa
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: a1-model-audit
          path: audit/
          retention-days: 1
