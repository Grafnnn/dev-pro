name: A1 Model Audit

on:
  push:
    branches:
      - tmp-a1-revp2-exterior-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_ZIP_URL: https://at.adobe.com/aXK6C7lAS2lRSKjj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install --disable-pip-version-check requests numpy scipy shapely trimesh pygltflib
      - name: Audit model
        run: python tools/audit_a1_model.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: a1-model-audit
          path: audit/
          retention-days: 1
